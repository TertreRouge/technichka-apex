---
- name: Gather installed package facts before Docker changes
  ansible.builtin.package_facts:
    manager: apt

- name: Refuse to replace conflicting Docker packages implicitly
  ansible.builtin.assert:
    that:
      - (ansible_facts.packages.keys() | list | intersect(docker_conflicting_packages) | length) == 0
    fail_msg: >-
      Conflicting container packages are installed:
      {{ ansible_facts.packages.keys() | list | intersect(docker_conflicting_packages) | join(', ') }}.
      This role will not remove packages or risk altering an existing Docker installation automatically.
      Review existing containers/volumes, migrate deliberately, or set docker_preinstalled=true if
      Docker and the Compose plugin are already managed and ready.
  when: not (docker_preinstalled | bool)

- name: Install Docker repository prerequisites
  ansible.builtin.apt:
    name:
      - ca-certificates
      - curl
      - gnupg
    state: present
    update_cache: true
    cache_valid_time: 3600
  when: not (docker_preinstalled | bool)

- name: Ensure APT keyrings directory exists
  ansible.builtin.file:
    path: /etc/apt/keyrings
    state: directory
    owner: root
    group: root
    mode: "0755"
  when: not (docker_preinstalled | bool)

- name: Download Docker repository signing key
  ansible.builtin.get_url:
    url: "{{ docker_apt_key_url }}"
    dest: /etc/apt/keyrings/docker.asc
    owner: root
    group: root
    mode: "0644"
  when: not (docker_preinstalled | bool)

- name: Configure official Docker APT repository
  ansible.builtin.apt_repository:
    repo: >-
      deb [arch={{ docker_architecture_map[ansible_architecture] }}
      signed-by=/etc/apt/keyrings/docker.asc]
      https://download.docker.com/linux/ubuntu {{ ansible_distribution_release }} stable
    filename: docker
    state: present
    update_cache: true
  when: not (docker_preinstalled | bool)

- name: Install Docker Engine and Compose plugin
  ansible.builtin.apt:
    name:
      - docker-ce
      - docker-ce-cli
      - containerd.io
      - docker-buildx-plugin
      - docker-compose-plugin
    state: present
    update_cache: true
    cache_valid_time: 3600
  when: not (docker_preinstalled | bool)

- name: Ensure Docker service is enabled and running
  ansible.builtin.service:
    name: docker
    state: started
    enabled: true

- name: Verify Docker client can reach the daemon
  ansible.builtin.command:
    argv:
      - docker
      - info
      - --format
      - "{{ '{{' }}.ServerVersion{{ '}}' }}"
  register: docker_server_version
  changed_when: false

- name: Verify Docker Compose plugin is available
  ansible.builtin.command: docker compose version
  register: docker_compose_version
  changed_when: false
