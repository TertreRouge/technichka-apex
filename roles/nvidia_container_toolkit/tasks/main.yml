---
- name: Verify host NVIDIA driver is loaded before configuring container runtime
  ansible.builtin.command: nvidia-smi
  register: nvidia_host_driver_check
  changed_when: false

- name: Install NVIDIA Container Toolkit repository prerequisites
  ansible.builtin.apt:
    name:
      - ca-certificates
      - curl
      - gnupg
      - python3-docker
    state: present
    update_cache: true
    cache_valid_time: 3600

- name: Ensure APT keyrings directory exists
  ansible.builtin.file:
    path: /etc/apt/keyrings
    state: directory
    owner: root
    group: root
    mode: "0755"

- name: Download NVIDIA Container Toolkit ASCII-armored signing key
  ansible.builtin.get_url:
    url: "{{ nvidia_container_toolkit_gpg_url }}"
    dest: /etc/apt/keyrings/nvidia-container-toolkit.asc
    owner: root
    group: root
    mode: "0644"

- name: Configure NVIDIA Container Toolkit APT repository
  ansible.builtin.apt_repository:
    repo: >-
      deb [signed-by=/etc/apt/keyrings/nvidia-container-toolkit.asc]
      https://nvidia.github.io/libnvidia-container/stable/deb/{{ docker_architecture_map[ansible_architecture] }} /
    filename: nvidia-container-toolkit
    state: present
    update_cache: true

- name: Install NVIDIA Container Toolkit
  ansible.builtin.apt:
    name: nvidia-container-toolkit
    state: present
    update_cache: true
    cache_valid_time: 3600

- name: Read Docker daemon configuration metadata before NVIDIA runtime setup
  ansible.builtin.stat:
    path: /etc/docker/daemon.json
  register: nvidia_daemon_json_stat_before

- name: Read existing Docker daemon configuration
  ansible.builtin.slurp:
    src: /etc/docker/daemon.json
  register: nvidia_daemon_json_before_file
  when: nvidia_daemon_json_stat_before.stat.exists

- name: Record original Docker daemon configuration
  ansible.builtin.set_fact:
    nvidia_daemon_json_before: "{{ nvidia_daemon_json_before_file.content | default('MISSING') }}"

- name: Configure Docker to use NVIDIA Container Runtime
  ansible.builtin.command: nvidia-ctk runtime configure --runtime=docker
  changed_when: false

- name: Read Docker daemon configuration after NVIDIA runtime setup
  ansible.builtin.slurp:
    src: /etc/docker/daemon.json
  register: nvidia_daemon_json_after_file

- name: Determine whether Docker configuration changed
  ansible.builtin.set_fact:
    nvidia_daemon_json_changed: "{{ nvidia_daemon_json_before != (nvidia_daemon_json_after_file.content | default('')) }}"

- name: Restart Docker only when NVIDIA runtime configuration changed
  ansible.builtin.service:
    name: docker
    state: restarted
    enabled: true
  when: nvidia_daemon_json_changed | bool

- name: Pull the pinned NVIDIA GPU test image
  community.docker.docker_image:
    name: "{{ nvidia_gpu_test_image }}"
    source: pull

- name: Verify NVIDIA GPU passthrough into a Docker container
  ansible.builtin.command:
    argv:
      - docker
      - run
      - --rm
      - --gpus
      - all
      - "{{ nvidia_gpu_test_image }}"
      - nvidia-smi
  register: nvidia_container_gpu_check
  changed_when: false
  retries: 3
  delay: 5
  until: nvidia_container_gpu_check.rc == 0
